<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TENSEI</title><style>body{margin:0;background:#0e1219;color:#f1f1f1;font:16px Segoe UI,Arial}header{padding:24px;background:#1b212a;border-bottom:1px solid #454545}h1{color:#d9b578;letter-spacing:4px}main{max-width:1200px;margin:auto;padding:20px}.panel{padding:22px;background:#1b212a;border:1px solid #394352;border-radius:15px;margin:20px 0}input,button{padding:10px;margin:6px;border:1px solid #475163;border-radius:8px;font:inherit;background:#131920;color:white}button{background:#d9b578;color:#111;font-weight:bold;cursor:pointer}button:disabled{opacity:.4}.scroll{overflow-x:auto}table{border-collapse:collapse;width:100%;min-width:950px}td,th{border-bottom:1px solid #3e4652;padding:5px}td input{width:90%;min-width:50px;border:0}tr.warn{background:#5a452c}small{color:#aab5c6}#status{white-space:pre-wrap;color:#ddbc7e}#preview{max-height:320px;max-width:100%}</style></head><body><header><h1>TENSEI</h1><small>Рукописная таблица → Cloud.ru → Excel</small></header><main><section class="panel"><h2>Cloud.ru</h2><label>API-ключ <input id="key" type="password" placeholder="Сохраняется на этом диске"></label><label>Модель <input id="model" placeholder="Точный ID модели с поддержкой изображений"></label><button id="save">Сохранить</button><small id="saved"></small></section><section class="panel"><h2>Распознавание журнала</h2><input id="photos" type="file" accept="image/jpeg,image/png,image/webp" multiple><button id="run">Распознать</button><button id="download">Скачать Excel</button><button id="clear">Очистить</button><p id="status">Выберите фотографии. Неоднозначные значения нужно проверить.</p><img id="preview" alt=""><div class="scroll"><table><thead><tr><th>№</th><th>Время</th><th>ТС</th><th>Водитель</th><th>Тара кг</th><th>Брутто кг</th><th>Нетто кг</th><th>Примечание</th><th>Проверить</th></tr></thead><tbody id="rows"></tbody></table></div></section></main><script>
const $=x=>document.getElementById(x);let data=[];async function post(action,x){const r=await fetch('/api/'+action,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(x)});if(action==='export'){if(!r.ok)throw Error((await r.json()).error);return r.blob()}const j=await r.json();if(!r.ok)throw Error(j.error);return j}
function render(){const body=$('rows');body.replaceChildren();data.forEach((r,i)=>{const tr=document.createElement('tr');if(r.uncertain)tr.className='warn';const td=document.createElement('td');td.textContent=i+1;tr.append(td);for(const k of ['time','vehicle','driver','tare','gross','net','note','uncertain']){const cell=document.createElement('td'),input=document.createElement('input');input.type=k==='uncertain'?'checkbox':'text';if(k==='uncertain')input.checked=!!r[k];else input.value=r[k]??'';input.onchange=()=>{r[k]=k==='uncertain'?input.checked:['tare','gross','net'].includes(k)?input.value===''?null:Number(input.value.replace(',','.')):input.value;render()};cell.append(input);tr.append(cell)}body.append(tr)})}
$('save').onclick=async()=>{try{await post('settings',{key:$('key').value,model:$('model').value});$('key').value='';$('saved').textContent=' Настройки сохранены'}catch(e){alert(e.message)}};
fetch('/api/settings').then(x=>x.json()).then(x=>{$('model').value=x.model||'';$('saved').textContent=x.hasKey?' Ключ уже сохранён':''});
$('run').onclick=async()=>{const files=[...$('photos').files];if(!files.length)return alert('Выберите изображения');$('run').disabled=true;try{for(let i=0;i<files.length;i++){const f=files[i];$('status').textContent='Страница '+(i+1)+'/'+files.length+': '+f.name;const image=await new Promise((ok,fail)=>{const r=new FileReader();r.onload=()=>ok(r.result);r.onerror=fail;r.readAsDataURL(f)});$('preview').src=image;const result=await post('recognize',{image});data.push(...result.rows);render()}$('status').textContent='Готово. Всего строк: '+data.length+' — проверьте данные перед экспортом.'}catch(e){$('status').textContent+='\nОшибка: '+e.message}finally{$('run').disabled=false}};
$('download').onclick=async()=>{try{const blob=await post('export',{rows:data}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='TENSEI.xlsx';a.click();setTimeout(()=>URL.revokeObjectURL(url),1500)}catch(e){alert(e.message)}};$('clear').onclick=()=>{if(confirm('Очистить таблицу?')){data=[];render()}};</script></body></html>
