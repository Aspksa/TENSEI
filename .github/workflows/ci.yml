name: TENSEI CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Verify on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install runtime dependencies
        run: npm install --no-audit --no-fund
      - name: Check module syntax
        run: |
          node --check server.mjs
          node --check app.js
          node --check analytics.js
          node --check lib/cloud.mjs
          node --check lib/workflow.mjs
          node --check lib/processing-queue.mjs
          node --check lib/records.mjs
          node --check lib/images.mjs
      - name: Compile optional Python OCR service
        run: python -m py_compile scripts/paddle_service.py
      - name: Test image conversion, anomalies and HTTP API
        run: npm test
