name: TENSEI CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Verify on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install runtime dependencies
        run: npm install --no-audit --no-fund
      - name: Emit first locked dependency resolution for maintainer (temporary)
        if: runner.os == 'Linux'
        run: |
          node -e "const fs=require('fs'),b=fs.readFileSync('package-lock.json').toString('base64');console.log('TENSEI_LOCK_COUNT:'+Math.ceil(b.length/1200));for(let i=0;i<b.length;i+=1200)console.log('TENSEI_LOCK_PART_'+(i/1200)+':'+b.slice(i,i+1200))"
      - name: Check module syntax
        run: |
          node --check server.mjs
          node --check app.js
          node --check humor-messages.js
          node --check analytics.js
          node --check lib/cloud.mjs
          node --check lib/workflow.mjs
          node --check lib/processing-queue.mjs
          node --check lib/table-layout.mjs
          node --check lib/optional-ocr.mjs
          node --check lib/records.mjs
          node --check lib/images.mjs
          node --check lib/photo-review-intelligence.mjs
          node --check lib/legion-server.mjs
          node --check analytics.js
          node --check lib/fleet-statistics.mjs
          node --check lib/fleet-excel.mjs
          node --check lib/rapidocr.mjs
          node --check lib/transport-reconcile.mjs
      - name: Compile optional Python OCR service
        run: python -m py_compile scripts/paddle_service.py scripts/grid_geometry.py scripts/test_grid_geometry.py scripts/cell_cache.py scripts/test_cell_cache.py scripts/rapidocr_service.py scripts/test_rapidocr_service.py
      - name: Test portable launcher preflight and no-overwrite migration (Windows)
        if: runner.os == 'Windows'
        shell: powershell
        run: ./scripts/test-portable.ps1
      - name: Install OpenCV test dependencies (Linux)
        if: runner.os == 'Linux'
        run: python -m pip install --quiet 'numpy>=1.24,<3' 'opencv-python-headless>=4.9,<5'
      - name: Test OpenCV table geometry (Linux)
        if: runner.os == 'Linux'
        run: python -m unittest discover -s scripts -p test_grid_geometry.py
      - name: Test durable local OCR cache (Windows and Linux)
        run: python -m unittest discover -s scripts -p test_cell_cache.py
      - name: Test optional RapidOCR service without downloading models
        run: python -m unittest discover -s scripts -p test_rapidocr_service.py
      - name: Test image conversion, anomalies and HTTP API
        run: npm test
